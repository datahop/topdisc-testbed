# 10k nodes, single topic, no churn. The reference run: every node registers the
# same topic and searches for it, stopping once its peer slots are full.
name: 10k-bandwidth-100
nodes: 10000
topics: 1
all_register: true
seed: 1

network:
  latency_ms: 30
  bandwidth_mibps: 100
  link_buf: 8192
  router_buf: 32768
  router_shards: 16

phases:
  bootstrap_wait: 180s
  register_wait: 5m
  register_stagger: 30ms
  search_stagger: 10ms
  search_timeout: 10m

# Peer slots, as geth: MaxPeers 50 split by DialRatio 3 -> 16 out / 34 in.
conn_model:
  enabled: true
  max_peers: 50
  dial_ratio: 3
  redial_wait: 35s

topic:
  ad_cache_size: 5000

traces:
  metrics: m.json
  overhead: oh.json
  overhead_series: series.json
  overhead_series_period: 30s
  checkpoint_interval: 60s
