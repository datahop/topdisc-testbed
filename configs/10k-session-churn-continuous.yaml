# 10k-session-churn with the continuous search model: every node runs lookups
# back to back (F_lookup=30, 30s between them) instead of stopping when its slots fill.
name: 10k-session-churn-continuous
population:
  nodes: 10000
  topics: 1
  all_register: true
  seed: 1
network:
  latency_ms: 30
  bandwidth_mibps: 1000
  link_buf: 8192
  router_buf: 32768
  router_shards: 16
phases:
  bootstrap_wait: 180s
  register_wait: 22m30s
  register_stagger: 30ms
  search_stagger: 10ms
  search_timeout: 10m
topic:
  ad_cache_size: 5000
conn_model:
  enabled: true
  max_peers: 50
  dial_ratio: 3
  redial_wait: 35s
session_churn:
  enabled: true
  gap: 30s
traces:
  metrics: m.json
  overhead: oh.json
  overhead_series: series.json
  overhead_series_period: 30s
  checkpoint_interval: 60s
search:
  model: continuous
  target_count: 30
  request_delay: 30s
  request_timeout: 60s
