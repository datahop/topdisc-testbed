# Fast end-to-end check of the pipeline. Note 500 nodes is *more* contended than
# 10k: fewer inbound slots exist network-wide, so refusals are much higher.
name: smoke-500
nodes: 500
topics: 1
all_register: true
seed: 1

network:
  latency_ms: 30
  bandwidth_mibps: 1000
  link_buf: 8192
  router_buf: 32768
  router_shards: 16

phases:
  bootstrap_wait: 45s
  register_wait: 90s
  register_stagger: 5ms
  search_stagger: 2ms
  search_timeout: 3m

# Peer slots, as geth: MaxPeers 50 split by DialRatio 3 -> 16 out / 34 in.
conn_model:
  enabled: true
  max_peers: 50
  dial_ratio: 3
  redial_wait: 35s

topic:
  ad_cache_size: 5000

traces:
  metrics: m.json
  overhead: oh.json
  overhead_series: series.json
  overhead_series_period: 30s
  checkpoint_interval: 60s
