# AWS, 25,000 nodes on 50 packed instances (500 each) in one zone with star-model WAN delays: plain discv5 built on the fork, the connection model (searches feed the dialer, stop at full slots), each node leaving and returning as its chain did in the crawl, one day over the run.
# One of the matrix scenarios written by tools/scenario_matrix.py.
name: aws-25k-discv5-conn-churn
scenario:
  population:
    nodes: 25000
    topics: 100
    seed: 1
    bootstrap_sample: 5
    zipf_s: 1.07
    topic_model: models/crawl-2026-09-18.json
    legacy_frac: 1
    legacy_bootnode: true
    legacy_build: fork
  network:
    latency_ms: 30
    bandwidth_mibps: 100
    model: regions
    regions:
      us-east-1: 0.4
      eu-central-1: 0.3
      ap-southeast-1: 0.3
    rtt_table: models/region-rtt.json
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 15m
    search_stagger: 10ms
    search_timeout: 90m
  topic:
    ad_cache_size: 5000
    search_yield_floor: 8
  search:
    model: conn
  conn_model:
    enabled: true
  session_churn:
    enabled: true
    model: models/crawl-2026-09-18.json
    window_real_hours: 24
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json
    home_region: us-east-1
    verbosity: 2
    grace: 30s
  aws_packed:
    region: us-east-1
    zone: us-east-1a
    instance_type: m6a.2xlarge
    coordinator_type: m6a.4xlarge
    vnodes_per_machine: 500
  wan:
    enabled: true
    delay_min_ms: 4
    delay_max_ms: 45
    jitter_ms: 3
    rate_kbps: 1000
  traces:
    host_sample_period: 30s
