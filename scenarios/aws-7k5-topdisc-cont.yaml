# AWS, 7,500 nodes in three regions, private addresses: TopDisc, one continuous search per node, no churn.
# One of the 32 matrix scenarios written by tools/scenario_matrix.py.
name: aws-7k5-topdisc-cont
scenario:
  population:
    nodes: 7500
    topics: 100
    seed: 1
    bootstrap_sample: 5
    zipf_s: 1.07
    topic_model: models/crawl-2026-09-18.json
  network:
    regions:
      us-east-1: 0.3334
      eu-central-1: 0.3333
      ap-southeast-1: 0.3333
  phases:
    bootstrap_wait: 3m
    start_window: 15m
    register_wait: 15m
    search_stagger: 10ms
    search_timeout: 90m
  topic:
    ad_cache_size: 5000
    search_yield_floor: 8
  search:
    model: continuous
  conn_model:
    enabled: false
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json
    home_region: us-east-1
    public_ips: false
