# Baseline without TopDisc: every node runs plain discv5 and publishes its
# service in its node record ("svc" entry). A node finds the providers of its
# service the only way plain discv5 allows: random-target DHT lookups, keeping
# the nodes whose record carries its service, for 1 h. Same workload as the
# TopDisc runs (the 100 largest chains of the 2026-09-18 crawl, no churn), so
# share found, time to find and lookups per search compare directly.
# 858 on-demand instances, one node each, over four regions.
#   deploy/aws.sh up scenarios/aws-crawl-1k-discv5.yaml && deploy/aws.sh run scenarios/aws-crawl-1k-discv5.yaml
name: aws-crawl-1k-discv5
workload: crawl-1k-discv5
profile: aws
