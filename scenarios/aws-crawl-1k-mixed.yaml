# Mixed network: legacy_frac of the nodes of every service run plain discv5
# (DHT random walk, "svc" record entry), the rest TopDisc. TopDisc nodes can
# only find TopDisc registrants; plain nodes find any node of their service.
# Sweep legacy_frac over 0.25, 0.5, 0.75 and 0.9 against the all-TopDisc run
# (legacy_frac 0) and the all-plain run (*-discv5).
# 858 on-demand instances, one node each, over four regions.
#   deploy/aws.sh up scenarios/aws-crawl-1k-mixed.yaml && deploy/aws.sh run scenarios/aws-crawl-1k-mixed.yaml
name: aws-crawl-1k-mixed
scenario:
  population:
    nodes: 858
    topics: 100
    topic_model: models/crawl-2026-09-18.json
    seed: 1
    legacy_frac: 0.5
  network:
    regions: {us-east-1: 0.2564, us-west-2: 0.2215, eu-central-1: 0.2611, ap-southeast-1: 0.2610}
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 15m
    search_stagger: 100ms
    search_timeout: 1h
  topic:
    ad_cache_size: 5000
    search_yield_floor: 8
  search:
    model: continuous
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json
    home_region: us-east-1
