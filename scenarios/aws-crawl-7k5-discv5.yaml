# Plain-discv5 half of aws-crawl-7k5-topdisc: every node runs plain discv5 built on the fork, the rest is the same.
name: aws-crawl-7k5-discv5
scenario:
  population:
    nodes: 7500
    topics: 100
    topic_model: models/crawl-2026-09-18.json
    seed: 1
    legacy_frac: 1
    legacy_bootnode: true
    legacy_build: fork
  network:
    regions: {us-east-1: 0.3334, eu-central-1: 0.3333, ap-southeast-1: 0.3333}
  phases:
    bootstrap_wait: 3m
    start_window: 15m
    register_wait: 15m
    search_stagger: 10ms
    search_timeout: 90m
  topic:
    ad_cache_size: 5000
    search_yield_floor: 8
  search:
    model: continuous
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json
    home_region: us-east-1
    public_ips: false
