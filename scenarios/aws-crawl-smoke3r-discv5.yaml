# Plain-discv5 half of aws-crawl-smoke3r-topdisc.
name: aws-crawl-smoke3r-discv5
scenario:
  population:
    nodes: 300
    topics: 20
    topic_model: models/crawl-2026-09-18.json
    seed: 1
    legacy_frac: 1
    legacy_bootnode: true
    legacy_build: fork
  network:
    regions: {us-east-1: 0.3334, eu-central-1: 0.3333, ap-southeast-1: 0.3333}
  phases:
    bootstrap_wait: 3m
    start_window: 3m
    register_wait: 3m
    search_stagger: 10ms
    search_timeout: 5m
  topic:
    ad_cache_size: 5000
    search_yield_floor: 8
  search:
    model: continuous
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json
    home_region: us-east-1
    public_ips: false
