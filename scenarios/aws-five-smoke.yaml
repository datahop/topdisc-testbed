# AWS smoke, lookup-only: 540 instances over three regions, 5 Zipf topics,
# every node registering and searching its own, one continuous unpaced
# search per node for 15 min, no connection model, adaptive floor 4, no
# churn. The real-backend counterpart of simnet-search-five-5k, for recall
# over time and registrar load without the dialer in the loop. Fits the
# 448-vCPU per-region quota. Spot is only for smokes: AWS reclaimed 13 % of
# the fleet inside 35 min on 2026-09-28, and every reclaimed node loses its
# trace; evaluation runs go on-demand (aws-five-1k).
#   deploy/aws.sh up scenarios/aws-five-smoke.yaml -var spot=true
#   deploy/aws.sh run scenarios/aws-five-smoke.yaml
name: aws-five-smoke
scenario:
  population:
    nodes: 540
    topics: 5
    zipf_s: 1
    seed: 1
  network:
    regions: {us-east-1: 0.4, eu-central-1: 0.3, ap-southeast-1: 0.3}
  phases:
    bootstrap_wait: 1m
    start_window: 3m
    register_wait: 5m
    search_stagger: 10ms
    search_timeout: 15m
  topic:
    ad_cache_size: 5000
    search_yield_floor: 4
  search:
    model: continuous
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json
    home_region: us-east-1
