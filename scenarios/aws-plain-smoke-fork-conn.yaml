# AWS smoke for the fork-built plain node: every node plain discv5 built on the
# fork, conn model. See aws-plain-smoke-topdisc.yaml for the run order.
name: aws-plain-smoke-fork-conn
scenario:
  population:
    nodes: 400
    topics: 10
    topic_model: models/crawl-2026-09-18.json
    seed: 1
    legacy_frac: 1
    legacy_bootnode: true
    legacy_build: fork
  network:
    regions: {us-east-1: 0.5, eu-central-1: 0.5}
  phases: {bootstrap_wait: 1m, start_window: 3m, register_wait: 5m, search_stagger: 10ms, search_timeout: 10m}
  search:
    model: conn
  conn_model:
    enabled: true
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json
    home_region: us-east-1
