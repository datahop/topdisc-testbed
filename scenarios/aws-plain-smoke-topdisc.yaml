# AWS smoke for the fork-built plain node, run 1 of 3: TopDisc nodes, connection
# model. Runs 2 and 3 are the same population on plain discv5 built on the fork
# (population.legacy_build fork), so all three report the same wire counters.
# 400 nodes over two regions fit the 448-vCPU per-region quota. One fleet:
#   deploy/aws.sh up scenarios/aws-plain-smoke-topdisc.yaml
#   KEEP=1 deploy/aws.sh run scenarios/aws-plain-smoke-topdisc.yaml
#   KEEP=1 deploy/aws.sh run scenarios/aws-plain-smoke-fork-conn.yaml
#   deploy/aws.sh run scenarios/aws-plain-smoke-fork-continuous.yaml
name: aws-plain-smoke-topdisc
scenario:
  population:
    nodes: 400
    topics: 10
    topic_model: models/crawl-2026-09-18.json
    seed: 1
  network:
    regions: {us-east-1: 0.5, eu-central-1: 0.5}
  phases: {bootstrap_wait: 1m, start_window: 3m, register_wait: 5m, search_stagger: 10ms, search_timeout: 10m}
  topic:
    ad_cache_size: 5000
  search:
    model: conn
  conn_model:
    enabled: true
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json
    home_region: us-east-1
