# Cloud acceptance run: 1,000 instances, one node each (terraform apply -var
# nodes=1000). Inventory path is relative to this file.
name: cloud-1k
scenario:
  population:
    nodes: 1000
    topics: 1
    all_register: true
    seed: 1
  phases:
    bootstrap_wait: 30s
    register_stagger: 20ms
    register_wait: 120s
    search_stagger: 10ms
    search_timeout: 300s
  topic:
    ad_cache_size: 5000
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json
