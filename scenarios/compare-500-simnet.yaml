# compare-500-aws.yaml on simnet: the same scenario block, a simnet testbed block.
name: compare-500-simnet
scenario:
  population:
    nodes: 500
    topics: 5
    zipf_s: 1.0
    seed: 1
  network:
    latency_ms: 50              # simnet only: one delay for every pair, about the mean one-way delay across the regions below
    bandwidth_mibps: 1000
    regions: {us-east-1: 0.4, eu-central-1: 0.3, ap-southeast-1: 0.3}
  phases:
    bootstrap_wait: 60s
    register_stagger: 20ms
    register_wait: 5m
    search_stagger: 10ms
    search_timeout: 10m
  topic:
    ad_cache_size: 5000
  search:
    model: scheduled
    intervals: 5
    target_count: 30
    request_timeout: 60s
testbed:
  simulator:
    link_buf: 8192
    router_buf: 32768
    router_shards: 16
  traces:
    metrics: metrics.json
    overhead: oh.json
    overhead_series: series.json
    overhead_series_period: 30s
    checkpoint_interval: 60s
