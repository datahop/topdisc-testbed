# Topics and churn from the 2026-09-18 discv5 crawl: 5000 nodes over the 20
# largest chains (the 20th takes the tail), each node leaving and returning
# as its chain's nodes did, over a 24 h window in real time. Connection-driven
# search, as a real client. `testbed preview scenarios/crawl-5k-24h.yaml`
# prints the topic sizes and churn rates the model produces for this run
# before spending 24 h on it.
name: crawl-5k-24h
scenario:
  population:
    nodes: 5000
    topics: 20
    topic_model: models/crawl-2026-09-18.json
    seed: 1
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 22m30s
    search_stagger: 100ms
    search_timeout: 24h
  topic:
    ad_cache_size: 5000
  search:
    model: conn
    target_count: 0
  conn_model:
    enabled: true
  session_churn:
    enabled: true
    model: models/crawl-2026-09-18.json
    window_real_hours: 0            # 0 = real time: 24 h of search is 24 h of the crawl
testbed:
  simulator:
    link_buf: 32768
    router_buf: 32768
    router_shards: 16
  traces:
    metrics: metrics.json
    overhead: oh.json
    overhead_series: series.json
    overhead_series_period: 5m
    checkpoint_interval: 10m
