# Grid'5000: 10000 Distem virtual nodes, 250 per machine, emulated geography from the
# RTT table (network.model: regions). deploy/g5k/g5k.py up scenarios/g5k-10k.yaml
name: g5k-10k
scenario:
  population:
    nodes: 10000
    topics: 1
    all_register: true
    seed: 1
  network:
    model: regions
    regions: {us-east-1: 0.4, eu-central-1: 0.3, ap-southeast-1: 0.3}
  phases:
    bootstrap_wait: 2m
    register_stagger: 20ms
    register_wait: 22m30s
    search_stagger: 10ms
    search_timeout: 60m
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json          # g5k.py copies it next to the scenario on the coordinator
    home_region: us-east-1
  g5k:
    site: nancy
    vnodes_per_machine: 250
  wan:
    rate_kbps: 160
