# Evaluation run, Grid'5000, no churn: 25000 real node processes over the
# 100 largest chains of the 2026-09-18 crawl (topics by the crawl's shares),
# every node up for the whole run, real RLPx sessions filled from the topic
# search, 6 h. This is the 2026-09-28 run's shape exactly -- 50 machines at
# 500 nodes, a 6 h search and search_yield_floor 4 -- so that a run on fork
# testbed.13 differs from that one by the fork alone. g5k-crawl-25k-4h is
# the shorter 100 x 250 version. The walltime covers setup, 22.5 min of
# registration, the run, and the trace collection, which at 25k nodes over
# 6 h is the longest tail of the night.
# addresses: crawl gives every node the address a crawled peer had, so the
# per-/24 limits on the routing table and on a registration bucket, and the ad
# cache's ipTree admission score, all run against real address diversity
# instead of being skipped as LAN. A /24 is kept whole on one machine so the
# machines route each other per /24.
# Grid'5000: one hostagent per kadeployed machine, vnodes_per_machine node
# processes in their own network namespaces (netns + netem, testbed.wan), no
# Distem. Node addresses are private 10.x, which geth treats as LAN: the
# per-/24 table limits and the admission IP score do not run here.
name: g5k-crawl-25k-6h-realip
scenario:
  population:
    nodes: 25000
    topics: 100
    topic_model: models/crawl-2026-09-18.json
    addresses: crawl
    seed: 1
  network:
    model: regions
    regions: {us-east-1: 0.4, eu-central-1: 0.3, ap-southeast-1: 0.3}
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 22m30s
    search_stagger: 10ms
    search_timeout: 6h
  topic:
    ad_cache_size: 5000
    search_yield_floor: 4
  search:
    model: conn
    target_count: 0
  conn_model:
    enabled: true
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json          # g5k.py copies it next to the scenario on the coordinator
    home_region: us-east-1
  g5k:
    site: nancy
    cluster: gros
    vnodes_per_machine: 500
    walltime: "10:00:00"
  wan:
    enabled: true
    rate_kbps: 1000
