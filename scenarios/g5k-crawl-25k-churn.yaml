# Evaluation run, Grid'5000: 25000 real node processes over the
# 100 largest chains of the 2026-09-18 crawl (topics by the crawl's shares),
# nodes join and leave on the crawl's churn, real RLPx sessions filled from the topic search.
# Every 25k run is fixed at 50 machines x 500 nodes with a 6 h search, so that
# runs stay comparable with one another. The network reaches steady state
# about an hour into the search -- traffic settles within 2% and ads held
# within 1% -- so the remaining five hours are there to be compared against,
# not to discover anything new. The walltime covers setup, 22.5 min of
# registration, the run, and the trace collection, which at this size is the
# longest tail of the night.
# search_yield_floor 8 is the adaptive search distance, -1 the default.
# g5k-crawl-25k is the same run without churn.
# Grid'5000: one hostagent per kadeployed machine, vnodes_per_machine node
# processes in their own network namespaces (netns + netem, testbed.wan), no
# Distem.
# Node addresses are private 10.x, which geth treats as LAN: the per-/24
# table limits and the admission IP score do not run here.
name: g5k-crawl-25k-churn
scenario:
  population:
    nodes: 25000
    topics: 100
    topic_model: models/crawl-2026-09-18.json
    seed: 1
  network:
    model: regions
    regions: {us-east-1: 0.4, eu-central-1: 0.3, ap-southeast-1: 0.3}
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 22m30s
    search_stagger: 10ms
    search_timeout: 6h
  topic:
    ad_cache_size: 5000
    search_yield_floor: 8
  search:
    model: conn
    target_count: 0
  conn_model:
    enabled: true
  session_churn:
    enabled: true
    model: models/crawl-2026-09-18.json
    window_real_hours: 0
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json          # g5k.py copies it next to the scenario on the coordinator
    home_region: us-east-1
  g5k:
    site: nancy
    cluster: gros
    vnodes_per_machine: 500
    walltime: "10:00:00"
  wan:
    enabled: true
    rate_kbps: 1000
