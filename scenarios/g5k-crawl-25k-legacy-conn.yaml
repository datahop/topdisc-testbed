# Evaluation run, Grid'5000, no churn: 25000 real node processes over the
# 100 largest chains of the 2026-09-18 crawl (topics by the crawl's shares),
# every node up for the whole run, 50 machines x 500 nodes, a 6 h search.
# Every node runs stock upstream geth v1.17.5 (legacy/) with no topic
# discovery: it publishes its service in the ENR and its dialer fills its
# outbound slots with providers found by random-target Kademlia lookups, the
# way a client that filters dial candidates by an ENR entry does. This is the
# plain-discv5 half of the connection-model pair: g5k-crawl-25k-realip is the
# TopDisc half, with the same addresses, population and phases. Compare the
# two on the time until a node has its peers and on what it costs to keep
# them; g5k-crawl-25k-legacy is the continuous-search half, for recall.
# legacy_bootnode stays false on purpose. A stock bootnode serves nothing until
# it has revalidated its table at ~20 nodes/min, which at 25000 nodes is around
# 20 h of bootstrap; the bootnode being TopDisc-capable gives the legacy nodes
# no topic ability, it only lets them find each other.
# addresses: crawl gives every node the address a crawled peer had, so the
# per-/24 limits on the routing table run against real address diversity
# instead of being skipped as LAN. A /24 is kept whole on one machine so the
# machines route each other per /24.
name: g5k-crawl-25k-legacy-conn
scenario:
  population:
    nodes: 25000
    topics: 100
    topic_model: models/crawl-2026-09-18.json
    addresses: crawl
    seed: 1
    legacy_frac: 1.0
  network:
    model: regions
    regions: {us-east-1: 0.4, eu-central-1: 0.3, ap-southeast-1: 0.3}
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 22m30s
    search_stagger: 10ms
    search_timeout: 6h
  topic:
    ad_cache_size: 5000
  search:
    model: conn
  conn_model:
    enabled: true
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json          # g5k.py copies it next to the scenario on the coordinator
    home_region: us-east-1
  g5k:
    site: nancy
    cluster: gros
    vnodes_per_machine: 500
    walltime: "10:00:00"
  wan:
    enabled: true
    rate_kbps: 1000
