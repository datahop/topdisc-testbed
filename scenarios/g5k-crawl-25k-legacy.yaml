# Evaluation run, Grid'5000, no churn: 25000 real node processes over the
# 100 largest chains of the 2026-09-18 crawl (topics by the crawl's shares),
# every node up for the whole run, 50 machines x 500 nodes, a 2 h search: the
# same length as g5k-crawl-25k-2h-continuous, its TopDisc pair. The walltime
# covers setup, 22.5 min of registration, the run, and the trace collection.
# Every node runs stock upstream geth v1.17.5 (legacy/) with no topic
# discovery at all: it publishes its service in the ENR and finds providers by
# random-target Kademlia lookups, which is all a topic-unaware client can do.
# node-legacy writes the same trace record as cmd/node, so this run drops into
# the same figures as g5k-crawl-25k-realip. The pair still differs by more than
# the protocol: a TopDisc searcher under the conn model dials what its topic
# search finds, so comparing the two on providers found compares an active
# search against a walk, not one protocol against another. Read the pair for
# cost and speed; docs/topdisc-vs-discv5.md does the like-for-like version in
# simnet.
# legacy_bootnode stays false on purpose. A stock bootnode serves nothing until
# it has revalidated its table at ~20 nodes/min, which at 25000 nodes is around
# 20 h of bootstrap; the bootnode being TopDisc-capable gives the legacy nodes
# no topic ability, it only lets them find each other.
# Grid'5000: one hostagent per kadeployed machine, vnodes_per_machine node
# processes in their own network namespaces (netns + netem, testbed.wan), no
# Distem.
# addresses: crawl gives every node the address a crawled peer had, so the
# per-/24 limits on the routing table and on a registration bucket, and the
# ad cache's ipTree admission score, all run against real address diversity
# instead of being skipped as LAN. A /24 is kept whole on one machine so the
# machines route each other per /24.
name: g5k-crawl-25k-legacy
scenario:
  population:
    nodes: 25000
    topics: 100
    topic_model: models/crawl-2026-09-18.json
    addresses: crawl
    seed: 1
    legacy_frac: 1.0
  network:
    model: regions
    regions: {us-east-1: 0.4, eu-central-1: 0.3, ap-southeast-1: 0.3}
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 22m30s
    search_stagger: 10ms
    search_timeout: 2h
  topic:
    ad_cache_size: 5000
  search:
    # continuous, not conn: the random-target walk in node-legacy sits behind
    # lookupOnly, which is true only for continuous and scheduled. Under conn
    # no walk is ever started and the only providers a node notices are the
    # ones the dialer happens to hand it while filling its outbound slots --
    # which it stops doing once they are full. The 2026-10-08 run was
    # configured that way and issued zero DHT lookups across all 24999 nodes:
    # 88.7% of its provider sightings landed in the first 10 s and there were
    # none at all between 10 s and the 6 h teardown. Matches
    # g5k-crawl-5k-discv5.
    model: continuous
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json          # g5k.py copies it next to the scenario on the coordinator
    home_region: us-east-1
  g5k:
    site: nancy
    cluster: gros
    vnodes_per_machine: 500
    walltime: "06:00:00"
  wan:
    enabled: true
    rate_kbps: 1000
