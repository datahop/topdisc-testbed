# Grid'5000 lookup-only run: 5000 real node processes on 20 machines, 5 Zipf
# topics, every node registering and searching its own, one continuous unpaced
# search per node for 1 h, no connection model, no churn. The Grid'5000
# counterpart of aws-five-1k and simnet-search-five-5k, for recall over time
# and registrar load. search_yield_floor 8 is the adaptive search distance,
# -1 the default searcher. The walltime covers setup, 37.5 min of start and
# registration, and the run.
#   deploy/g5k/g5k.py up  scenarios/g5k-five-5k.yaml
#   deploy/g5k/g5k.py run scenarios/g5k-five-5k.yaml
# Grid'5000: one hostagent per kadeployed machine, vnodes_per_machine node
# processes in their own network namespaces (netns + netem, testbed.wan), no
# Distem. Node addresses are private 10.x, which geth treats as LAN: the
# per-/24 table limits and the admission IP score do not run here.
name: g5k-five-5k
scenario:
  population:
    nodes: 5000
    topics: 5
    zipf_s: 1
    seed: 1
  network:
    model: regions
    regions: {us-east-1: 0.4, eu-central-1: 0.3, ap-southeast-1: 0.3}
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 22m30s
    search_stagger: 10ms
    search_timeout: 1h
  topic:
    ad_cache_size: 5000
    search_yield_floor: 8
  search:
    model: continuous
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json          # g5k.py copies it next to the scenario on the coordinator
    home_region: us-east-1
  g5k:
    site: nancy
    cluster: gros
    vnodes_per_machine: 250
    walltime: "03:00:00"
  wan:
    enabled: true
    rate_kbps: 1000
