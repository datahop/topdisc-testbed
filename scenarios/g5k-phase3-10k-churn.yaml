# phase3-10k plus the fitted session churn; sweep session_churn.scale for the §2 churn-rate axis. 10k nodes, one service each
# over 300 services (Zipf 1), E = 15 min, C = 1000, F_lookup = 30, one lookup
# per node in each of L = 6 intervals of a 60-minute search phase. Protocol
# parameters follow the plan (K_lookup 5, F_return 10); the code defaults are
# 16/16, see #12. On Grid'5000 the star model emulates the plan's 8-91 ms pair
# RTT; the per-node cap is 1 Mbit/s, not the plan's 20 KB/s; for AWS swap the testbed block for aws-10k's, the
# regions are then real and the star model is ignored.
# Grid'5000: one hostagent per kadeployed machine, vnodes_per_machine node
# processes in their own network namespaces (netns + netem, testbed.wan), no
# Distem. Node addresses are private 10.x, which geth treats as LAN: the
# per-/24 table limits and the admission IP score do not run here.
name: g5k-phase3-10k-churn
scenario:
  population:
    nodes: 10000
    topics: 300
    zipf_s: 1.0
    seed: 1
  network:
    model: star
    regions: {us-east-1: 0.4, eu-central-1: 0.3, ap-southeast-1: 0.3}
  phases:
    bootstrap_wait: 2m
    start_window: 15m          # = E: node starts, and so registrations and ad expiries, spread over a full lifetime
    register_wait: 22m30s      # 1.5 x E: registrations settle before lookups start
    search_stagger: 10ms
    search_timeout: 60m
  topic:
    ad_lifetime: 15m
    ad_cache_size: 1000
    search_bucket_size: 5
    topic_nodes_limit: 10
  session_churn:
    enabled: true
    model: models/nebula-discv5-2026-08.json
    window_real_hours: 24
    scale: 1
  search:
    model: scheduled
    intervals: 6
    target_count: 30
    request_timeout: 60s
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json
    home_region: us-east-1
  g5k:
    site: nancy
    cluster: gros
    vnodes_per_machine: 250
    walltime: "03:00:00"
  wan:
    enabled: true
    delay_min_ms: 4
    delay_max_ms: 45
    rate_kbps: 1000
