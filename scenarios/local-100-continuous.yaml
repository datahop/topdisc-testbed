# local-100 with the continuous search model: every node keeps one search running for
# the whole search phase and consumes its results without dialing.
name: local-100-continuous
scenario:
  population:
    nodes: 100
    topics: 1
    all_register: true
    seed: 1
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 15s
    register_stagger: 20ms
    register_wait: 60s
    search_stagger: 10ms
    search_timeout: 90s
  topic:
    ad_cache_size: 5000
  search:
    model: continuous
testbed:
  backend: local
  traces: {}
