# local-100 with the continuous search model: every node runs lookups back to
# back, each ending at 30 distinct registrants or 30s.
name: local-100-continuous
scenario:
  population:
    nodes: 100
    topics: 1
    all_register: true
    seed: 1
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 15s
    register_stagger: 20ms
    register_wait: 60s
    search_stagger: 10ms
    search_timeout: 90s
  topic:
    ad_cache_size: 5000
  conn_model:
    enabled: true
    max_peers: 50
    dial_ratio: 3
    redial_wait: 35s
  search:
    model: continuous
    target_count: 30
    request_delay: 5s
    request_timeout: 30s
testbed:
  backend: local
  traces: {}
