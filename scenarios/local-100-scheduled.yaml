# local-100 with the plan's lookup schedule: 5 intervals, one lookup per node at a random
# time in each, ending at 30 registrants or 15 s.
# back, each ending at 30 distinct registrants or 30s.
name: local-100-scheduled
scenario:
  population:
    nodes: 100
    topics: 1
    all_register: true
    seed: 1
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 15s
    register_stagger: 20ms
    register_wait: 60s
    search_stagger: 10ms
    search_timeout: 90s
  topic:
    ad_cache_size: 5000
  search:
    model: scheduled
    intervals: 5
    target_count: 30
    request_timeout: 15s
testbed:
  backend: local
  traces: {}
