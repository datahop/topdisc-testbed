# Churn check for the paired report: local-200-topdisc-continuous with the
# crawl's session churn compressed so that a 4 min search stands for 24 h.
# Nodes leave and return while every searcher keeps looking; the runner keeps
# each session's trace and the report scores against the providers up at the
# end. Pairs with local-200-plain-fork-churn.yaml.
name: local-200-topdisc-churn
scenario:
  population: {nodes: 200, topics: 5, zipf_s: 1.0, seed: 3}
  phases: {bootstrap_wait: 20s, start_window: 20s, register_wait: 30s, search_stagger: 10ms, search_timeout: 4m}
  search: {model: continuous}
  session_churn: {enabled: true, model: models/crawl-2026-09-18.json, window_real_hours: 24}

testbed:
  backend: local
