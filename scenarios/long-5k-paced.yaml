# 5k nodes, 5 topics (Zipf s=1), continuous search paced like a node filling and
# refreshing its peers: 16 new registrants at once, then one new per minute.
# The search phase runs until stopped: SIGTERM to the simnet process ends the
# searches and the run writes its reports.
name: long-5k-paced
scenario:
  population:
    nodes: 5000
    topics: 5
    zipf_s: 1.0
    seed: 1
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 180s
    register_stagger: 30ms
    register_wait: 22m30s
    search_stagger: 10ms
    search_timeout: 48h
  topic:
    ad_cache_size: 5000
  search:
    model: continuous
    initial_results: 16
    result_interval: 1m
testbed:
  simulator:
    link_buf: 8192
    router_buf: 32768
    router_shards: 16
  traces:
    metrics: metrics.json
    overhead: oh.json
    overhead_series: series.json
    overhead_series_period: 5m
    checkpoint_interval: 10m
