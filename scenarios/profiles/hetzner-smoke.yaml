# Backend profile of hetzner-smoke.
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json          # written by deploy/hetzner.sh from the terraform outputs
    home_region: us-east-1
    grace: 30s
  hetzner:
    location: fsn1
    server_type: cx43
    coordinator_type: ccx13
    vnodes_per_machine: 200
  wan:
    enabled: true
    delay_min_ms: 4
    delay_max_ms: 45
    jitter_ms: 3
    rate_kbps: 1000
  traces:
    host_sample_period: 30s
