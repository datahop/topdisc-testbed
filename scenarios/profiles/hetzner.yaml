# Hetzner Cloud, 25,000 nodes on 50 packed servers (500 each) with star-model WAN delays: backend profile of the hetzner-25k matrix scenarios, written by tools/scenario_matrix.py.
testbed:
  backend: cloud
  cloud:
    inventory: inventory.json
    home_region: us-east-1
    verbosity: 2
    grace: 30s
  hetzner:
    location: fsn1
    server_type: cx53
    coordinator_type: cx53
    vnodes_per_machine: 500
  wan:
    enabled: true
    delay_min_ms: 4
    delay_max_ms: 45
    jitter_ms: 3
    rate_kbps: 1000
  traces:
    host_sample_period: 30s
