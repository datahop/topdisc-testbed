# Every parameter, with its default and meaning. Copy and edit.
name: my-run

scenario:
  population:
    nodes: 5                           # discv5 nodes to spawn
    topics: 1                          # distinct topics; >1 assigns one per node by Zipf
    all_register: false                # one shared topic that every node registers and searches
    register_frac: 0.5                 # single-topic mode: fraction that register, the rest search
    zipf_s: 1.07                       # Zipf skew for topic assignment when topics > 1
    common_topic: false                # topics > 1: everyone also registers and searches topic 0
    seed: 0                            # RNG seed for every random draw; 0 = time
    legacy_frac: 0                     # fraction of nodes without the topic-discovery ENR flag
    vanilla_frac: 0                    # fraction running stock upstream geth (needs -tags vanilla)
  network:
    latency_ms: 30                     # per-pair one-way latency, ms
    bandwidth_mibps: 100               # per-direction link bandwidth
  phases:
    bootstrap_wait: 3s                 # after spawning, before registrations start
    register_stagger: 0s               # gap between consecutive nodes starting to register
    register_wait: 5s                  # after the last node starts registering, before searches start
    search_stagger: 0s                 # gap between consecutive searchers starting
    search_timeout: 30s                # length of the search phase
    refresh_interval: 0s               # discv5 table refresh; 0 = default 30m
  topic:
    ad_lifetime: 0s                    # ad lifetime; 0 = default 15m. Also sets reg_attempt_timeout
    ad_cache_size: 0                   # ads a registrar holds; 0 = default 5000
    reg_attempt_timeout: 0s            # give up on a registrar after this; 0 = 1.5 x ad_lifetime
    search_bucket_size: 0              # search table entries per distance bucket; 0 = spec default 16
    topic_nodes_limit: 0               # topic nodes in a TOPICQUERY reply; 0 = default 16
    aux_nodes_limit: 0                 # closest-to-topic nodes attached to TOPICQUERY and REGTOPIC replies; 0 = default 8
    nodes_per_source_bucket: 0         # cap per source per bucket; 0 = default 1 (inert on topdisc)
    remove_on_expiry: false            # drop ads at expiry instead of renewing (inert on topdisc)
  search:
    model: conn                        # conn: search only while outbound slots are empty; continuous: lookups back to back
    request_delay: 0s                  # continuous: pause between lookups
    request_timeout: 0s                # continuous: give up on a lookup after this; 0 = only target_count ends it
    target_count: 0                    # conn: stop a searcher after this many distinct registrants; continuous: end each lookup at this many. 0 = never
  conn_model:
    enabled: false
    max_peers: 50                      # total slots per node
    dial_ratio: 3                      # 1/N of slots are outbound
    redial_wait: 35s                   # cooldown before re-dialing the same node
  session_churn:
    enabled: false                     # 42.3% stay all run; the rest fall off geometrically from a short mode
    gap: 30s                           # how long a departed node is unreachable
  disconnect:
    interval: 0s                       # drop a fraction of live connections this often; 0 = off
    frac: 0.01                         # fraction dropped per interval
  churn:
    interval: 0s                       # churn round period; 0 = off
    frac: 0.1                          # fraction of nodes acted on per round
    mode: steadystate                  # steadystate (50/50 leave/join) or killonly

testbed:
  simulator:
    link_buf: 0                        # link input queue depth; 0 = simnet default 1024
    link_no_aqm: false                 # skip fq_codel and rate limiting on links
    router_buf: 0                      # router per-shard queue; 0 = simnet default 8192
    router_shards: 0                   # router shards; 0 = simnet default 16
  harness:
    spawn_delay: 0s                    # gap between spawning consecutive nodes
    max_bootnodes: 20                  # bootnodes each new node contacts
    reg_probe_period: 500ms            # how often the harness polls for registration admission
    search_pause_max: 0s               # random sleep up to this between results; 0 with conn_model
    search_pause_novel_only: false     # only pause on registrants not seen before
  traces:
    metrics: ""                        # search and registration record (JSON)
    overhead: ""                       # per-node traffic totals by message type (JSON)
    overhead_series: ""                # traffic and ad-cache samples over time (JSON)
    overhead_series_period: 30s        # sampling period for overhead_series
    reach: ""                          # per-searcher registrar reach sets (JSON)
    snapshot_dir: ""                   # periodic find-count snapshots
    checkpoint_interval: 0s            # print coverage this often during search; 0 = off
  safety:
    abort_on_drop: true                # exit on the first dropped packet: drops bias every timing
