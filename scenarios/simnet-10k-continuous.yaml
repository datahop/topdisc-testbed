# simnet-10k-churn with the continuous search model: every node keeps one
# search running for the whole search phase and consumes its results without
# dialing. Saturates 48 cores at 7.5k nodes and above; use the conn model for
# runs longer than an hour.
name: simnet-10k-continuous
scenario:
  population:
    nodes: 10000
    topics: 1
    all_register: true
    seed: 1
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 180s
    register_wait: 22m30s  # 1.5 x ad_lifetime (15m)
    register_stagger: 30ms
    search_stagger: 10ms
    search_timeout: 10m
  topic:
    ad_cache_size: 5000
  session_churn:
    enabled: true
    gap: 30s
  search:
    model: continuous
testbed:
  simulator:
    link_buf: 8192
    router_buf: 32768
    router_shards: 16
  traces:
    metrics: metrics.json
    overhead: oh.json
    overhead_series: series.json
    overhead_series_period: 30s
    checkpoint_interval: 60s
