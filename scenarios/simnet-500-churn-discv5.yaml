# Plain discv5 walk under session churn at 500 nodes: a quick check of the
# walker's iterator path, including closing and reopening the walk when a
# node leaves and returns. Same crawl workload and churn model as the 5k runs,
# compressed into a 6 min search.
#   ./simnet scenarios/simnet-500-churn-discv5.yaml
name: simnet-500-churn-discv5
scenario:
  population:
    nodes: 500
    topics: 20
    topic_model: models/crawl-2026-09-18.json
    addresses: crawl
    seed: 1
    legacy_frac: 1
    legacy_bootnode: true
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 20s
    start_window: 30s
    register_wait: 30s
    search_stagger: 10ms
    search_timeout: 6m
  topic:
    ad_cache_size: 5000
    search_yield_floor: 8
  search:
    model: continuous
  session_churn:
    enabled: true
    model: models/crawl-2026-09-18.json
    window_real_hours: 24
testbed:
  simulator:
    link_buf: 32768
    router_buf: 32768
    router_shards: 16
  traces:
    metrics: metrics.json
    overhead: oh.json
    overhead_series: series.json
    overhead_series_period: 1m
