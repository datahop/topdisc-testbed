# TopDisc counterpart of simnet-crawl-5k-churn-discv5: 5000 nodes over the
# 100 largest chains of the 2026-09-18 crawl, every node on TopDisc, each node
# leaving and returning as its chain's nodes did in the crawl, in real time,
# one continuous search per node for 1 h 30 min.
#   ./simnet scenarios/simnet-crawl-5k-churn-topdisc.yaml
name: simnet-crawl-5k-churn-topdisc
scenario:
  population:
    nodes: 5000
    topics: 100
    topic_model: models/crawl-2026-09-18.json
    addresses: crawl
    seed: 1
    legacy_frac: 0
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 15m
    search_stagger: 100ms
    search_timeout: 90m
  topic:
    ad_cache_size: 5000
    search_yield_floor: 8
  search:
    model: continuous
  session_churn:
    enabled: true
    model: models/crawl-2026-09-18.json
    window_real_hours: 0
testbed:
  simulator:
    link_buf: 32768
    router_buf: 32768
    router_shards: 16
  traces:
    metrics: metrics.json
    overhead: oh.json
    overhead_series: series.json
    overhead_series_period: 5m
    checkpoint_interval: 15m
