# Mixed network: legacy_frac of the nodes of every service run plain discv5
# (DHT random walk, "svc" record entry), the rest TopDisc. TopDisc nodes can
# only find TopDisc registrants; plain nodes find any node of their service.
# Sweep legacy_frac over 0.25, 0.5, 0.75 and 0.9 against the all-TopDisc run
# (legacy_frac 0) and the all-plain run (*-discv5).
#   ./simnet scenarios/simnet-crawl-5k-mixed.yaml
name: simnet-crawl-5k-mixed
scenario:
  population:
    nodes: 5000
    topics: 100
    topic_model: models/crawl-2026-09-18.json
    addresses: crawl
    seed: 1
    legacy_frac: 0.5
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 15m
    search_stagger: 100ms
    search_timeout: 1h
  topic:
    ad_cache_size: 5000
    search_yield_floor: 8
  search:
    model: continuous
testbed:
  simulator:
    link_buf: 32768
    router_buf: 32768
    router_shards: 16
  traces:
    metrics: metrics.json
    overhead: oh.json
    overhead_series: series.json
    overhead_series_period: 5m
    checkpoint_interval: 15m
