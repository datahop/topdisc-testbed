# Evaluation run, simnet: 10000 nodes over the 100 largest chains of the
# 2026-09-18 crawl (topics by the crawl's shares, node addresses by the
# crawl's /24 histogram), crawl churn in real time with hard departures,
# connection-driven search, 4 h. search_yield_floor 8 is the adaptive search
# distance; -1 runs the default searcher for the A/B. Needs about 76 GB RSS:
#   GOMEMLIMIT=96GiB SIMNET_HEAPPROF=1h ./simnet scenarios/simnet-crawl-10k-4h.yaml
name: simnet-crawl-ip-check
scenario:
  population:
    nodes: 2000
    topics: 100
    topic_model: models/crawl-2026-09-18.json
    addresses: crawl
    seed: 1
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 45s
    start_window: 2m
    register_wait: 3m
    search_stagger: 5ms
    search_timeout: 4m
  topic:
    ad_cache_size: 5000
    search_yield_floor: 4
  search:
    model: conn
    target_count: 0
  conn_model:
    enabled: true
  session_churn:
    enabled: false
    model: models/crawl-2026-09-18.json
    window_real_hours: 0
testbed:
  simulator:
    link_buf: 32768
    router_buf: 32768
    router_shards: 16
  traces:
    metrics: metrics.json
    overhead: oh.json
    overhead_series: series.json
    overhead_series_period: 15m
    checkpoint_interval: 30m
