# Address check, simnet: 2000 nodes over the 100 largest chains of the
# 2026-09-18 crawl (topics by the crawl's shares), addresses: crawl so every
# node has the address a crawled peer had and the per-/24 limits and the
# admission IP score run; no churn, connection-driven search, 4 min, search
# floor 4. Pair with simnet-crawl-ip-control (same settings on simnet's own
# addresses) to see what real address diversity changes.
name: simnet-crawl-ip-check
scenario:
  population:
    nodes: 2000
    topics: 100
    topic_model: models/crawl-2026-09-18.json
    addresses: crawl
    seed: 1
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 45s
    start_window: 2m
    register_wait: 3m
    search_stagger: 5ms
    search_timeout: 4m
  topic:
    ad_cache_size: 5000
    search_yield_floor: 4
  search:
    model: conn
    target_count: 0
  conn_model:
    enabled: true
  session_churn:
    enabled: false
    model: models/crawl-2026-09-18.json
    window_real_hours: 0
testbed:
  simulator:
    link_buf: 32768
    router_buf: 32768
    router_shards: 16
  traces:
    metrics: metrics.json
    overhead: oh.json
    overhead_series: series.json
    overhead_series_period: 15m
    checkpoint_interval: 30m
