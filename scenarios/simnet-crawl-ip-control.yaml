# Address control, simnet: 2000 nodes over the 100 largest chains of the
# 2026-09-18 crawl (topics by the crawl's shares) on simnet's default index
# addresses, one node per /24, so the per-/24 limits and the admission IP
# score never see a shared prefix; no churn, connection-driven search, 4 min,
# search floor 4. The control for simnet-crawl-ip-check, which differs by
# addresses: crawl alone.
name: simnet-crawl-ip-control
scenario:
  population:
    nodes: 2000
    topics: 100
    topic_model: models/crawl-2026-09-18.json

    seed: 1
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 45s
    start_window: 2m
    register_wait: 3m
    search_stagger: 5ms
    search_timeout: 4m
  topic:
    ad_cache_size: 5000
    search_yield_floor: 4
  search:
    model: conn
    target_count: 0
  conn_model:
    enabled: true
  session_churn:
    enabled: false
    model: models/crawl-2026-09-18.json
    window_real_hours: 0
testbed:
  simulator:
    link_buf: 32768
    router_buf: 32768
    router_shards: 16
  traces:
    metrics: metrics.json
    overhead: oh.json
    overhead_series: series.json
    overhead_series_period: 15m
    checkpoint_interval: 30m
