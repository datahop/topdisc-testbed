# Search A/B over a topic mix: 5000 nodes, 5 Zipf topics, half register, no
# churn, no connection model, one continuous unpaced search per node for 1 h.
# search_yield_floor 4 is the adaptive search distance, 0 the default searcher.
name: simnet-search-five-5k
scenario:
  population:
    nodes: 5000
    topics: 5
    zipf_s: 1
    register_frac: 0.5
    seed: 1
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 22m30s
    search_stagger: 100ms
    search_timeout: 1h
  topic:
    ad_cache_size: 5000
    search_yield_floor: 4
  search:
    model: continuous
testbed:
  simulator:
    link_buf: 32768
    router_buf: 32768
    router_shards: 16
  traces:
    metrics: metrics.json
    overhead: oh.json
    overhead_series: series.json
    overhead_series_period: 5m
    checkpoint_interval: 10m
