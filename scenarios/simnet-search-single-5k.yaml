# Search A/B with nothing else in the picture: 5000 nodes that all register
# and search one topic, no churn, no connection model, one continuous unpaced
# search per node for 1 h. Measures registrar load against search
# performance. search_yield_floor 4 is the adaptive search distance, 0 the
# default searcher; search_aux_radius 1 additionally asks aux nodes only for
# the active bucket and its neighbours.
name: simnet-search-single-5k
scenario:
  population:
    nodes: 5000
    topics: 1
    all_register: true
    seed: 1
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 22m30s
    search_stagger: 100ms
    search_timeout: 1h
  topic:
    ad_cache_size: 5000
    search_yield_floor: 4
  search:
    model: continuous
testbed:
  simulator:
    link_buf: 32768
    router_buf: 32768
    router_shards: 16
  traces:
    metrics: metrics.json
    overhead: oh.json
    overhead_series: series.json
    overhead_series_period: 5m
    checkpoint_interval: 10m
