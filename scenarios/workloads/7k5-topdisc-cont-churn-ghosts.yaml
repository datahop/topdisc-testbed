# Workload of aws-7k5-topdisc-cont-churn-ghosts.
scenario:
  population:
    nodes: 7500
    topics: 100
    seed: 1
    bootstrap_sample: 5
    zipf_s: 1.07
    topic_model: models/crawl-2026-09-18.json
  network:
    regions:
      us-east-1: 0.3334
      eu-central-1: 0.3333
      ap-southeast-1: 0.3333
  phases:
    bootstrap_wait: 3m
    start_window: 15m
    register_wait: 15m
    search_stagger: 10ms
    search_timeout: 90m
  topic:
    ad_cache_size: 5000
    search_yield_floor: 8
  search:
    model: continuous
  conn_model:
    enabled: false
  session_churn:
    enabled: true
    model: models/crawl-2026-09-18.json
    window_real_hours: 24
  ghosts:
    tables: models/crawl-2026-10-23-tables.json.gz
    pool: 75000
