# Workload of aws-crawl-1k-discv5.
scenario:
  population:
    nodes: 858
    topics: 100
    topic_model: models/crawl-2026-09-18.json
    seed: 1
    legacy_frac: 1
    legacy_bootnode: true
  network:
    regions: {us-east-1: 0.2564, us-west-2: 0.2215, eu-central-1: 0.2611, ap-southeast-1: 0.2610}
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 15m
    search_stagger: 100ms
    search_timeout: 1h
  topic:
    ad_cache_size: 5000
    search_yield_floor: 8
  search:
    model: continuous
