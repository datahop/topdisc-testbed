# crawl-1k-mixed as one network: every node provides and searches the same
# service, so each must find all 857 others, TopDisc or plain. TopDisc nodes
# mix the topic search with the svc-filtered random walk (geth
# --discovery.topic) and every searcher is scored against all providers.
# Set the TopDisc share per run with --set population.legacy_frac.
scenario:
  population:
    nodes: 858
    topics: 1
    seed: 1
    legacy_frac: 0.5
    legacy_build: fork
  network:
    regions: {us-east-1: 0.2564, us-west-2: 0.2215, eu-central-1: 0.2611, ap-southeast-1: 0.2610}
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 15m
    search_stagger: 100ms
    search_timeout: 1h
  topic:
    ad_cache_size: 1000
    search_yield_floor: 8
  search:
    model: continuous
    topdisc_walk: true
    score_all_providers: true
