# Workload of g5k-crawl-5k-mixed.
scenario:
  population:
    nodes: 5000
    topics: 100
    topic_model: models/crawl-2026-09-18.json
    seed: 1
    legacy_frac: 0.5
  network:
    model: regions
    regions: {us-east-1: 0.4, eu-central-1: 0.3, ap-southeast-1: 0.3}
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 15m
    search_stagger: 100ms
    search_timeout: 1h
  topic:
    ad_cache_size: 5000
    search_yield_floor: 8
  search:
    model: continuous
