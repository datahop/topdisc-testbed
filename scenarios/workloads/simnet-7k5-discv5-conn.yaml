# 7,500 nodes: plain discv5 built on the fork, the connection model (searches feed the dialer, stop at full slots), no churn. Matrix workload written by tools/scenario_matrix.py.
scenario:
  population:
    nodes: 7500
    topics: 100
    seed: 1
    bootstrap_sample: 5
    zipf_s: 1.07
    topic_model: models/crawl-2026-09-18.json
    addresses: crawl
    legacy_frac: 1
    legacy_bootnode: true
    legacy_build: fork
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 15m
    search_stagger: 100ms
    search_timeout: 90m
  topic:
    ad_cache_size: 5000
    search_yield_floor: 8
  search:
    model: conn
  conn_model:
    enabled: true
