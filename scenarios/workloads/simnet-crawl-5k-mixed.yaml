# Workload of simnet-crawl-5k-mixed.
scenario:
  population:
    nodes: 5000
    topics: 100
    topic_model: models/crawl-2026-09-18.json
    addresses: crawl
    seed: 1
    legacy_frac: 0.5
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 180s
    start_window: 15m
    register_wait: 15m
    search_stagger: 100ms
    search_timeout: 1h
  topic:
    ad_cache_size: 5000
    search_yield_floor: 8
  search:
    model: continuous
