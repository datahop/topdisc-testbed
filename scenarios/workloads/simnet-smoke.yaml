# Workload of simnet-smoke.
scenario:
  population:
    nodes: 500
    topics: 1
    seed: 1
  network:
    latency_ms: 30
    bandwidth_mibps: 1000
  phases:
    bootstrap_wait: 45s
    register_wait: 90s
    register_stagger: 5ms
    search_stagger: 2ms
    search_timeout: 3m
  topic:
    ad_cache_size: 5000
  conn_model:
    enabled: true
    max_peers: 50
    dial_ratio: 3
    redial_wait: 35s
